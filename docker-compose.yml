version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lis_db
      POSTGRES_USER: lis_user
      POSTGRES_PASSWORD: lis_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lis-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lis-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lis.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - lis-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  lis-network:
    driver: bridge
